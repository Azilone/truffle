[package]
name = "truffle-search"
version = "0.1.0"
description = "Find any file by name, content or meaning. Instantly, offline."
edition.workspace = true
license.workspace = true
default-run = "truffle"

[[bin]]
name = "truffle"
path = "src/main.rs"

[dependencies]
truffle-index = { path = "../truffle-index" }
truffle-semantic = { path = "../truffle-semantic" }
truffle-extract = { path = "../truffle-extract" }
truffle-embed = { path = "../truffle-embed" }
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
sha2 = "0.10"
ureq = "3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[features]
vulkan = ["truffle-embed/vulkan"]
cuda = ["truffle-embed/cuda"]
