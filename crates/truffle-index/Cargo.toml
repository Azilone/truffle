[package]
name = "truffle-index"
version = "0.1.0"
description = "Whole-disk file index: fuzzy names, typo tolerance, indexed content grep (forked from fsearch)."
edition.workspace = true
license.workspace = true

[lib]
name = "fsearch"

[[bin]]
name = "truffle"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
