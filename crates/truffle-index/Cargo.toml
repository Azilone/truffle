[package]
name = "truffle-index"
version = "0.1.0"
description = "Whole-disk file index: fuzzy names, typo tolerance, indexed content grep (forked from fsearch)."
edition.workspace = true
license.workspace = true

[lib]
name = "truffle_index"

[dependencies]
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify = { version = "8", default-features = false }
