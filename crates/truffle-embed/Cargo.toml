[package]
name = "truffle-embed"
version = "0.1.0"
description = "EmbeddingGemma 2 on a statically linked llama.cpp: text, image and audio into one 768-dim space."
edition.workspace = true
license.workspace = true
links = "llama"

[dependencies]
serde_json = "1"

[build-dependencies]
