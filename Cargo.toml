[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kevindejouet/truffle"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
